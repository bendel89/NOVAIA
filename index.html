<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>NOVAIA</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0b0b0f;
      color: #fff;
      height: 100dvh;
      display: flex;
      flex-direction: column;
    }
    header {
      padding: 14px 16px;
      background: #12121a;
      border-bottom: 1px solid #2a2a35;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .logo {
      font-weight: 700;
      font-size: 18px;
      letter-spacing: 0.5px;
    }
    .logo span { color: #007AFF; }
    .header-btns {
      display: flex;
      gap: 8px;
    }
    .header-btns button {
      background: #1e1e28;
      border: 1px solid #333;
      color: #ccc;
      border-radius: 8px;
      padding: 6px 10px;
      font-size: 13px;
    }
    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .message {
      max-width: 85%;
      padding: 12px 16px;
      border-radius: 18px;
      line-height: 1.5;
      font-size: 15px;
      position: relative;
    }
    .user {
      align-self: flex-end;
      background: #007AFF;
      color: white;
      border-bottom-right-radius: 4px;
      white-space: pre-wrap;
    }
    .assistant {
      align-self: flex-start;
      background: #1c1c26;
      border-bottom-left-radius: 4px;
    }
    .assistant p { margin-bottom: 8px; }
    .assistant p:last-child { margin-bottom: 0; }
    .assistant ul, .assistant ol {
      margin: 8px 0;
      padding-left: 20px;
    }
    .assistant li { margin-bottom: 4px; }
    .assistant strong { font-weight: 600; }
    .copy-btn {
      position: absolute;
      top: 8px;
      right: 8px;
      background: #2a2a35;
      border: none;
      color: #aaa;
      font-size: 11px;
      padding: 3px 7px;
      border-radius: 6px;
      opacity: 0.7;
    }
    .typing {
      display: inline-flex;
      gap: 4px;
      padding: 4px 0;
    }
    .typing span {
      width: 6px;
      height: 6px;
      background: #888;
      border-radius: 50%;
      animation: bounce 1.2s infinite;
    }
    .typing span:nth-child(2) { animation-delay: 0.2s; }
    .typing span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes bounce {
      0%, 80%, 100% { transform: translateY(0); }
      40% { transform: translateY(-6px); }
    }
    .input-area {
      display: flex;
      padding: 12px;
      background: #12121a;
      border-top: 1px solid #2a2a35;
      gap: 8px;
    }
    #input {
      flex: 1;
      padding: 13px 16px;
      border-radius: 24px;
      border: none;
      background: #1e1e28;
      color: white;
      font-size: 16px;
      outline: none;
    }
    #send {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      border: none;
      background: #007AFF;
      color: white;
      font-size: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #send:disabled { opacity: 0.5; }
    #key-screen {
      position: fixed;
      inset: 0;
      background: #0b0b0f;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      z-index: 100;
    }
    #key-screen h2 { margin-bottom: 8px; }
    #key-screen p {
      text-align: center;
      color: #888;
      font-size: 14px;
      max-width: 300px;
      margin-bottom: 16px;
    }
    #key-screen input {
      width: 100%;
      max-width: 340px;
      padding: 14px 16px;
      border-radius: 12px;
      border: 1px solid #333;
      background: #1e1e28;
      color: white;
      font-size: 16px;
      margin-bottom: 16px;
    }
    #key-screen button {
      padding: 14px 28px;
      border-radius: 12px;
      border: none;
      background: #007AFF;
      color: white;
      font-size: 16px;
      font-weight: 600;
    }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div id="key-screen">
    <h2>Clé API Claude</h2>
    <p>Ta clé reste uniquement sur ton iPhone. Elle n’est jamais envoyée sur GitHub.</p>
    <input type="password" id="api-key-input" placeholder="sk-ant-api03-...">
    <button id="save-key">Enregistrer et commencer</button>
  </div>

  <header>
    <div class="logo">NOVA<span>IA</span> 🇨🇭</div>
    <div class="header-btns">
      <button id="clear-btn">Effacer</button>
      <button id="key-btn">Clé</button>
    </div>
  </header>

  <div id="chat"></div>

  <div class="input-area">
    <input type="text" id="input" placeholder="Écris ton message..." autocomplete="off">
    <button id="send">↑</button>
  </div>

  <script>
    const chat = document.getElementById("chat");
    const input = document.getElementById("input");
    const sendBtn = document.getElementById("send");
    const keyScreen = document.getElementById("key-screen");
    const keyInput = document.getElementById("api-key-input");
    const saveKeyBtn = document.getElementById("save-key");
    const clearBtn = document.getElementById("clear-btn");
    const keyBtn = document.getElementById("key-btn");

    let messages = [];
    const SYSTEM_PROMPT = `Tu es NOVAIA, une intelligence artificielle amicale, claire et utile.
Tu parles toujours en français de Suisse.
Tu es patient et tu expliques simplement.
Tu connais bien la Suisse (transports, météo, culture, cantons, etc.).
Quand c'est utile, utilise des listes et du gras pour rendre tes réponses plus lisibles.`;

    function getApiKey() {
      return localStorage.getItem("claude_api_key");
    }

    function showKeyScreen() {
      keyScreen.classList.remove("hidden");
    }

    function hideKeyScreen() {
      keyScreen.classList.add("hidden");
    }

    function addMessage(role, text) {
      const div = document.createElement("div");
      div.className = `message ${role}`;

      if (role === "assistant") {
        div.innerHTML = marked.parse(text);
        
        // Bouton Copier
        const copyBtn = document.createElement("button");
        copyBtn.className = "copy-btn";
        copyBtn.textContent = "Copier";
        copyBtn.onclick = () => {
          navigator.clipboard.writeText(text).then(() => {
            copyBtn.textContent = "Copié !";
            setTimeout(() => copyBtn.textContent = "Copier", 1500);
          });
        };
        div.appendChild(copyBtn);
      } else {
        div.textContent = text;
      }

      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
    }

    // Démarrage
    if (getApiKey()) {
      hideKeyScreen();
      addMessage("assistant", "Salut ! Je suis **NOVAIA**. Pose-moi n'importe quelle question 😊");
    } else {
      showKeyScreen();
    }

    saveKeyBtn.addEventListener("click", () => {
      const key = keyInput.value.trim();
      if (!key.startsWith("sk-ant-")) {
        alert("La clé doit commencer par sk-ant-");
        return;
      }
      localStorage.setItem("claude_api_key", key);
      hideKeyScreen();
      chat.innerHTML = "";
      messages = [];
      addMessage("assistant", "Clé enregistrée ! Pose-moi ta première question 😊");
    });

    keyBtn.addEventListener("click", () => {
      if (confirm("Tu veux changer ta clé API Claude ?")) {
        localStorage.removeItem("claude_api_key");
        showKeyScreen();
      }
    });

    clearBtn.addEventListener("click", () => {
      if (confirm("Effacer toute la conversation ?")) {
        chat.innerHTML = "";
        messages = [];
        addMessage("assistant", "Conversation effacée. Pose-moi une nouvelle question 😊");
      }
    });

    async function sendMessage() {
      const text = input.value.trim();
      if (!text) return;

      const API_KEY = getApiKey();
      if (!API_KEY) {
        showKeyScreen();
        return;
      }

      input.value = "";
      sendBtn.disabled = true;

      addMessage("user", text);
      messages.push({ role: "user", content: text });

      const thinking = document.createElement("div");
      thinking.className = "message assistant";
      thinking.innerHTML = `<div class="typing"><span></span><span></span><span></span></div>`;
      chat.appendChild(thinking);
      chat.scrollTop = chat.scrollHeight;

      try {
        const response = await fetch("https://api.anthropic.com/v1/messages", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "x-api-key": API_KEY,
            "anthropic-version": "2023-06-01",
            "anthropic-dangerous-direct-browser-access": "true"
          },
          body: JSON.stringify({
            model: "claude-sonnet-4-5",
            max_tokens: 1024,
            system: SYSTEM_PROMPT,
            messages: messages
          })
        });

        const data = await response.json();

        if (data.error) {
          thinking.textContent = "Erreur : " + (data.error.message || "Problème avec l'API");
          if (data.error.type === "authentication_error") {
            localStorage.removeItem("claude_api_key");
            showKeyScreen();
          }
        } else if (data.content && data.content[0] && data.content[0].text) {
          const reply = data.content[0].text;
          thinking.remove();
          addMessage("assistant", reply);
          messages.push({ role: "assistant", content: reply });
        } else {
          thinking.textContent = "Réponse inattendue.";
        }
      } catch (err) {
        thinking.textContent = "Erreur de connexion.";
        console.error(err);
      }

      sendBtn.disabled = false;
      input.focus();
    }

    sendBtn.addEventListener("click", sendMessage);
    input.addEventListener("keypress", (e) => {
      if (e.key === "Enter") sendMessage();
    });
  </script>
</body>
</html>
