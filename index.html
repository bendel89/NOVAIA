<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Mon IA Suisse – Claude</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f0f0f;
      color: #fff;
      height: 100dvh;
      display: flex;
      flex-direction: column;
    }
    header {
      padding: 16px;
      background: #1a1a1a;
      text-align: center;
      font-weight: 600;
      border-bottom: 1px solid #333;
    }
    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .message {
      max-width: 85%;
      padding: 12px 16px;
      border-radius: 18px;
      line-height: 1.45;
      white-space: pre-wrap;
    }
    .user {
      align-self: flex-end;
      background: #007AFF;
      color: white;
    }
    .assistant {
      align-self: flex-start;
      background: #2c2c2e;
    }
    .input-area {
      display: flex;
      padding: 12px;
      background: #1a1a1a;
      border-top: 1px solid #333;
      gap: 8px;
    }
    #input {
      flex: 1;
      padding: 12px 16px;
      border-radius: 24px;
      border: none;
      background: #2c2c2e;
      color: white;
      font-size: 16px;
      outline: none;
    }
    #send {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      border: none;
      background: #007AFF;
      color: white;
      font-size: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #send:disabled { opacity: 0.5; }
    #key-screen {
      position: fixed;
      inset: 0;
      background: #0f0f0f;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      z-index: 100;
    }
    #key-screen input {
      width: 100%;
      max-width: 360px;
      padding: 14px 16px;
      border-radius: 12px;
      border: 1px solid #444;
      background: #1a1a1a;
      color: white;
      font-size: 16px;
      margin: 16px 0;
    }
    #key-screen button {
      padding: 14px 28px;
      border-radius: 12px;
      border: none;
      background: #007AFF;
      color: white;
      font-size: 16px;
      font-weight: 600;
    }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <!-- Écran pour entrer la clé (seulement la première fois) -->
  <div id="key-screen">
    <h2 style="margin-bottom: 8px;">Clé API Claude</h2>
    <p style="text-align:center; color:#aaa; font-size:14px; max-width:320px;">
      Ta clé reste uniquement sur ton iPhone.<br>
      Elle n’est jamais envoyée sur GitHub.
    </p>
    <input type="password" id="api-key-input" placeholder="sk-ant-api03-...">
    <button id="save-key">Enregistrer et commencer</button>
  </div>

  <header>Mon IA Suisse 🇨🇭 (Claude)</header>
  <div id="chat"></div>
  <div class="input-area">
    <input type="text" id="input" placeholder="Écris ton message..." autocomplete="off">
    <button id="send">↑</button>
  </div>

  <script>
    const chat = document.getElementById("chat");
    const input = document.getElementById("input");
    const sendBtn = document.getElementById("send");
    const keyScreen = document.getElementById("key-screen");
    const keyInput = document.getElementById("api-key-input");
    const saveKeyBtn = document.getElementById("save-key");

    let messages = [];
    const SYSTEM_PROMPT = `Tu es une intelligence artificielle amicale, claire et utile.
Tu parles toujours en français de Suisse.
Tu es patient et tu expliques simplement.
Tu connais bien la Suisse (transports, météo, culture, cantons, etc.).`;

    // Vérifier si la clé est déjà enregistrée
    function getApiKey() {
      return localStorage.getItem("claude_api_key");
    }

    function showKeyScreen() {
      keyScreen.classList.remove("hidden");
    }

    function hideKeyScreen() {
      keyScreen.classList.add("hidden");
    }

    // Au démarrage
    if (getApiKey()) {
      hideKeyScreen();
      addMessage("assistant", "Salut ! Je suis ton IA personnelle basée sur Claude. Pose-moi n'importe quelle question 😊");
    } else {
      showKeyScreen();
    }

    saveKeyBtn.addEventListener("click", () => {
      const key = keyInput.value.trim();
      if (!key.startsWith("sk-ant-")) {
        alert("La clé doit commencer par sk-ant-");
        return;
      }
      localStorage.setItem("claude_api_key", key);
      hideKeyScreen();
      addMessage("assistant", "Clé enregistrée ! Pose-moi ta première question 😊");
    });

    function addMessage(role, text) {
      const div = document.createElement("div");
      div.className = `message ${role}`;
      div.textContent = text;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
    }

    async function sendMessage() {
      const text = input.value.trim();
      if (!text) return;

      const API_KEY = getApiKey();
      if (!API_KEY) {
        showKeyScreen();
        return;
      }

      input.value = "";
      sendBtn.disabled = true;

      addMessage("user", text);
      messages.push({ role: "user", content: text });

      const thinking = document.createElement("div");
      thinking.className = "message assistant";
      thinking.textContent = "…";
      chat.appendChild(thinking);
      chat.scrollTop = chat.scrollHeight;

      try {
        const response = await fetch("https://api.anthropic.com/v1/messages", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "x-api-key": API_KEY,
            "anthropic-version": "2023-06-01"
          },
          body: JSON.stringify({
            model: "claude-sonnet-4-5",
            max_tokens: 1024,
            system: SYSTEM_PROMPT,
            messages: messages
          })
        });

        const data = await response.json();

        if (data.error) {
          thinking.textContent = "Erreur : " + (data.error.message || "Problème avec l'API");
          if (data.error.type === "authentication_error") {
            localStorage.removeItem("claude_api_key");
            showKeyScreen();
          }
        } else if (data.content && data.content[0] && data.content[0].text) {
          const reply = data.content[0].text;
          thinking.textContent = reply;
          messages.push({ role: "assistant", content: reply });
        } else {
          thinking.textContent = "Réponse inattendue.";
        }
      } catch (err) {
        thinking.textContent = "Erreur de connexion.";
      }

      sendBtn.disabled = false;
      input.focus();
    }

    sendBtn.addEventListener("click", sendMessage);
    input.addEventListener("keypress", (e) => {
      if (e.key === "Enter") sendMessage();
    });
  </script>
</body>
</html>
